<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>gameStoB | Checkout</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/purchase.css" />
  </head>

  <body>
    <div id="header"></div>

    <main class="checkout-page">
      <div class="checkout-wrapper">
        <h1 class="checkout-title">Checkout</h1>

        <div class="checkout-grid">
          <div class="checkout-left">
            <section class="cart-section">
              <div class="section-header">
                <h2>Shopping Cart</h2>

                <span id="itemCount"> 0 Items </span>
              </div>

              <div id="cartItems"></div>
            </section>

            <section class="payment-section">
              <h2>Payment Information</h2>

              <form id="checkoutForm">
                <div class="form-row">
                  <div class="form-group">
                    <label> Full Name </label>

                    <input type="text" id="fullname" placeholder="John Doe" />
                  </div>

                  <div class="form-group">
                    <label> Email </label>

                    <input
                      type="email"
                      id="email"
                      placeholder="john@example.com"
                    />
                  </div>
                </div>

                <div class="form-group">
                  <label> Card Number </label>

                  <input
                    type="text"
                    id="cardNumber"
                    placeholder="1234 5678 9012 3456"
                  />
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label> Expiration </label>

                    <input type="text" id="expiry" placeholder="MM/YY" />
                  </div>

                  <div class="form-group">
                    <label> CVV </label>

                    <input type="password" id="cvv" placeholder="123" />
                  </div>
                </div>

                <div class="form-row">
                  <div class="form-group">
                    <label> Country </label>

                    <select id="country">
                      <option value="">Select Country</option>

                      <option>Indonesia</option>
                      <option>Singapore</option>
                      <option>Malaysia</option>
                      <option>Thailand</option>
                      <option>Vietnam</option>
                      <option>Philippines</option>
                      <option>Japan</option>
                      <option>South Korea</option>
                      <option>China</option>
                      <option>India</option>
                      <option>Australia</option>
                      <option>New Zealand</option>
                      <option>United States</option>
                      <option>Canada</option>
                      <option>Mexico</option>
                      <option>United Kingdom</option>
                      <option>Germany</option>
                      <option>France</option>
                      <option>Italy</option>
                      <option>Spain</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label> City </label>

                    <input type="text" id="city" placeholder="Jakarta" />
                  </div>
                </div>

                <div class="form-group">
                  <label> Billing Address </label>

                  <textarea
                    id="address"
                    rows="4"
                    placeholder="Street, City, ZIP Code"
                  ></textarea>
                </div>

                <div class="promo-box">
                  <input type="text" id="promoCode" placeholder="Promo Code" />

                  <button type="button" id="applyPromo">Apply</button>
                </div>

                <div class="checkbox-group">
                  <input type="checkbox" id="terms" />

                  <label for="terms">
                    I agree to the Terms & Conditions and Privacy Policy
                  </label>
                </div>

                <button type="submit" class="purchase-btn">
                  COMPLETE PURCHASE
                </button>
              </form>
            </section>
          </div>

          <aside class="summary-section">
            <h2>Order Summary</h2>

            <div class="summary-row">
              <span> Subtotal </span>

              <span id="subtotalPrice"> Rp 0 </span>
            </div>

            <div class="summary-row">
              <span> Tax (10%) </span>

              <span id="taxPrice"> Rp 0 </span>
            </div>

            <div class="summary-row">
              <span> Discount </span>

              <span id="discountPrice"> Rp 0 </span>
            </div>

            <div class="summary-row total">
              <span> Total </span>

              <strong id="totalPrice"> Rp 0 </strong>
            </div>

            <div class="security-info">
              <p>
                <i class="fa-solid fa-shield-halved"></i>

                Secure SSL Encrypted Payment
              </p>
            </div>

            <div class="delivery-info">
              <p>
                <i class="fa-solid fa-gamepad"></i>

                Digital game keys are delivered instantly after purchase.
              </p>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <div id="toast" class="toast"></div>

    <div id="footer"></div>

    <script src="js/main.js"></script>
    <script src="js/purchase.js"></script>
  </body>
</html>
